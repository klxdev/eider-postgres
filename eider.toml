[package]
name = "postgres"
version = "0.7.2"
eider = "0.7"
description = "A PostgreSQL client in Eider: wire protocol v3 (SCRAM-SHA-256, MD5, simple and extended queries, prepared statements, transactions, COPY, LISTEN/NOTIFY, cancellation), TLS, a bounded connection pool and typed queries from records (docs/postgres.md)"

# SCRAM-SHA-256 (SHA-256, HMAC) over the core's crypto provider: the toolchain's own package
# (Eider 0.7.6 and later ship packages/crypto and its backend), the same one eider-tls uses.
[deps.crypto]
toolchain = true
uses = ["io"]

# sslmode=require, verify-ca and verify-full after the SSLRequest handshake (postgres.secure).
# A release of eider-tls whose own crypto dependency is the toolchain's (its changelog).
[deps.tls]
git = "https://github.com/klxdev/eider-tls.git"
version = "0.7.2"
uses = ["net", "io", "clock", "fs"]
