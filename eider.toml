[package]
name = "postgres"
version = "0.7.0"
eider = "0.7"
description = "A PostgreSQL client in Eider: wire protocol v3 (SCRAM-SHA-256, MD5, simple and extended queries, prepared statements, transactions, COPY, LISTEN/NOTIFY, cancellation), TLS, a bounded connection pool and typed queries from records (docs/postgres.md)"

# SCRAM-SHA-256 (SHA-256, HMAC) over the core's crypto provider. The package lives in
# eider-lang's checkout (packages/crypto) and is not published on its own yet; eider-pkg wants
# one `crypto`, so this is the path eider-tls's own link has (scripts/env.sh sets both).
[deps.crypto]
path = "target/deps/tls/target/deps/crypto"
uses = ["io"]

# sslmode=require, verify-ca and verify-full after the SSLRequest handshake (postgres.secure).
# A path dependency until crypto is published, because a package fetched from its repository
# cannot have one: scripts/env.sh links ../eider-tls (or $EIDER_TLS) at target/deps/tls.
[deps.tls]
path = "target/deps/tls"
uses = ["net", "io", "clock", "fs"]
